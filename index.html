<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hina's pick | 暮らしのおすすめ</title>
<meta name="description" content="Threadsで紹介したアイテムをまとめています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ef;
    --card: #ffffff;
    --text: #3a3631;
    --sub: #8a8278;
    --line: #e6e0d6;
    --accent: #9a8c74;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", sans-serif;
    line-height: 1.9;
    letter-spacing: 0.04em;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 20px 48px; }
  .pr {
    display: inline-block;
    font-size: 11px;
    color: var(--sub);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 12px;
    margin-bottom: 28px;
  }
  h1 { font-weight: 500; font-size: 26px; letter-spacing: 0.12em; }
  .lead { color: var(--sub); font-size: 14px; margin-top: 12px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 48px 0 24px; }
  .tabs span {
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
  }
  .thumb {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: #efeae2;
    display: grid;
    place-items: center;
    color: var(--sub);
    font-size: 12px;
  }
  .item p { font-size: 13px; margin-top: 10px; }
  .item small { color: var(--sub); font-size: 11px; }
  .soon { text-align: center; color: var(--sub); font-size: 13px; margin-top: 40px; }
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--sub);
    text-align: center;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <main class="wrap">
    <span class="pr">PR・アフィリエイト広告を利用しています</span>
    <h1>hina's pick</h1>
    <p class="lead">Threadsで紹介した、暮らしがちょっと整うアイテムをまとめています。</p>

    <nav class="tabs">
      <span>すべて</span>
      <span>収納</span>
      <span>キッチン</span>
      <span>ギフト</span>
    </nav>

    <section class="grid">
      <div class="item">
        <div class="thumb">coming soon</div>
        <p>おすすめアイテム</p>
