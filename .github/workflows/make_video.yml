name: スライド動画を作る
on:
  workflow_dispatch:
    inputs:
      name:
        description: "出力名（videos/◯◯.mp4）"
        required: true
      title:
        description: "1枚目にのせる文字（| で改行。空でもOK）"
        required: false
        default: ""
      images:
        description: "画像URLをスペース区切り（2〜6枚）"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg > /dev/null
          pip install -q pillow
      - run: python tools/make_video.py "${{ inputs.name }}" "${{ inputs.title }}" ${{ inputs.images }}
      - run: |
          git config user.name "hinas-pick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos
          git diff --cached --quiet || git commit -m "動画を追加: ${{ inputs.name }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
